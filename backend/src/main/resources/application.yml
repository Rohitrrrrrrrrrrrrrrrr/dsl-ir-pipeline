server:
  port: 8090
  servlet:
    context-path: /

spring:
  application:
    name: dsl-ir-pipeline
  # Loads the gitignored secret file (key lives there, never in committed config).
  config:
    import: optional:file:./llm-secret.properties
  datasource:
    url: jdbc:h2:mem:dslirdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  jackson:
    serialization:
      indent-output: true
      write-dates-as-timestamps: false

pipeline:
  llm:
    anthropic:
      enabled: true
      # Resolution: ANTHROPIC_API_KEY env var → anthropic.api.key (from the
      # gitignored llm-secret.properties) → empty. The key is NEVER in this file.
      api-key: ${ANTHROPIC_API_KEY:${anthropic.api.key:}}
      model: claude-sonnet-4-5-20250929
      base-url: https://api.anthropic.com
      version: 2023-06-01

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

# Observability — Micrometer counters exposed at /actuator/prometheus
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,metrics,info
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: dsl-ir-pipeline

logging:
  level:
    com.dslpipeline: INFO
