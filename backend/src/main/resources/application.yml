server:
  port: 8090
  servlet:
    context-path: /

spring:
  application:
    name: dsl-ir-pipeline
  datasource:
    url: jdbc:h2:mem:dslirdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  jackson:
    serialization:
      indent-output: true
      write-dates-as-timestamps: false

pipeline:
  llm:
    anthropic:
      enabled: false
      api-key: ${ANTHROPIC_API_KEY:}
      model: claude-sonnet-4-5-20250929
      base-url: https://api.anthropic.com
      version: 2023-06-01

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

logging:
  level:
    com.dslpipeline: INFO
